<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monday review – Burpee Timer mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B45309}a:hover{color:#92400E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(27,27,31,0.45); color: #1B1B1F; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <section aria-label="Last week review" style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 16px; height: 800px; box-sizing: border-box">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #D9D9DE"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; color: #5F6168; text-transform: uppercase; letter-spacing: 0.08em">Your week · 12–18 Oct</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Nice week!</h1>
      </div>
      <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #0E6B62; background: #DFF3F0; padding: 6px 12px; border-radius: 999px">↑ Building</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 72px; line-height: 0.9">155</span>
        <span style="font-size: 17px; color: #5F6168; font-weight: 500">burpees</span>
      </div>
      <span style="font-size: 14px; color: #3F4148">9% more than your 4-week average (143)</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #F7F7F8; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Goal</span>
        <span style="font-size: 16px; font-weight: 700">Hit ✓</span>
      </div>
      <div style="background: #F7F7F8; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Workouts</span>
        <span style="font-size: 16px; font-weight: 700">4</span>
      </div>
      <div style="background: #F7F7F8; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Streak</span>
        <span style="font-size: 16px; font-weight: 700">4 weeks</span>
      </div>
    </div>

    <div style="background: #1B1B1F; color: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 700; color: #FFB866; text-transform: uppercase; letter-spacing: 0.08em">Highlight</span>
      <span style="font-size: 15px; font-weight: 600">First Navy SEAL workout — 5 done</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #ECECEE; padding-top: 16px">
      <span style="font-size: 17px; font-weight: 700">New week. Plan your sessions?</span>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <button aria-pressed="true" style="height: 44px; border-radius: 12px; border: none; background: #F28C00; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 14px; font-weight: 700">M</button>
        <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #DCDCE0; background: #FFFFFF; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600">T</button>
        <button aria-pressed="true" style="height: 44px; border-radius: 12px; border: none; background: #F28C00; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 14px; font-weight: 700">W</button>
        <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #DCDCE0; background: #FFFFFF; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600">T</button>
        <button aria-pressed="true" style="height: 44px; border-radius: 12px; border: none; background: #F28C00; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 14px; font-weight: 700">F</button>
        <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #DCDCE0; background: #FFFFFF; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600">S</button>
        <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: 1px solid #DCDCE0; background: #FFFFFF; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600">S</button>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3F4148">
        When? (your cue)
        <input type="text" value="After morning coffee" style="height: 48px; border-radius: 12px; border: 1px solid #DCDCE0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 15px; color: #1B1B1F; background: #FFFFFF">
      </label>
      <span style="font-size: 13px; color: #5F6168">Shown on Home as “Today’s plan: after morning coffee”.</span>
    </div>

    <div style="flex: 1"></div>
    <button style="width: 100%; height: 58px; border-radius: 999px; border: none; background: #F28C00; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 17px; font-weight: 700">Start the week</button>
  </section>
</div>
</body>
</html>
