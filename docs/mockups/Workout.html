<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout detail – Burpee Timer mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B45309}a:hover{color:#92400E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1B1B1F; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 12px 0">
    <button aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; color: #1B1B1F; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <button aria-label="Edit workout" style="width: 44px; height: 44px; border: none; background: transparent; color: #1B1B1F; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 20px 20px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">40 Standard burpees</h1>
    <button style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 14px; border-radius: 999px; border: none; background: #FFF1DE; color: #7C4A03; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600">
      How to do it
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7.5v.5"></path></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 12px 22px; border-bottom: 1px solid #ECECEE">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 13px; color: #5F6168">Burpees</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1">40</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 13px; color: #5F6168">Pace</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1">15<span style="font-size: 24px"> s</span></span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 13px; color: #5F6168">Duration</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1">10:00</span>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #F7F7F8; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #5F6168; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em">Best pace</span>
        <span style="font-size: 18px; font-weight: 700">14 s <span style="font-size: 13px; font-weight: 500; color: #5F6168">Standard</span></span>
      </div>
      <div style="background: #F7F7F8; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #5F6168; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em">Done</span>
        <span style="font-size: 18px; font-weight: 700">12 times</span>
      </div>
    </div>

    <h2 style="margin: 6px 0 0; font-size: 15px; font-weight: 700">Recent</h2>
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F0F0F2">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Today, 7:12</span>
          <span style="font-size: 13px; color: #5F6168">7:00 · 15 s pace</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 12px; font-weight: 600; color: #7C4A03; background: #FFF1DE; padding: 4px 8px; border-radius: 999px">Partial</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">28 / 40</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F0F0F2">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Mon 19 Oct</span>
          <span style="font-size: 13px; color: #5F6168">10:00 · 15 s pace</span>
        </div>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">40 / 40</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Fri 16 Oct</span>
          <span style="font-size: 13px; color: #5F6168">31 + 9 catch-up · 15 s pace</span>
        </div>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">40 / 40</span>
      </div>
    </div>
  </div>

  <div style="padding: 12px 20px 28px">
    <button style="width: 100%; height: 60px; border-radius: 999px; border: none; background: #F28C00; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; box-shadow: 0 8px 20px rgba(242,140,0,0.3)">START</button>
  </div>
</div>
</body>
</html>
