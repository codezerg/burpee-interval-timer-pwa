<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopped early – Burpee Timer mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B45309}a:hover{color:#92400E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #1B1B1F; font-family: Inter, system-ui, sans-serif; overflow: hidden; padding: 44px 20px 28px; gap: 18px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <span style="font-size: 12px; font-weight: 700; color: #7C4A03; background: #FFF1DE; padding: 5px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.08em">Stopped early</span>
    <h1 style="margin: 6px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Good effort — saved.</h1>
    <span style="font-size: 15px; color: #5F6168">40 Standard burpees · every 15 s</span>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: center; gap: 6px">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 104px; line-height: 0.9">28</span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 40px; color: #5F6168">/ 40</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #F7F7F8; border-radius: 16px; padding: 14px 6px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 12px; color: #5F6168">Time</span>
      <span style="font-size: 18px; font-weight: 700">7:00</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 12px; color: #5F6168">Pace</span>
      <span style="font-size: 18px; font-weight: 700">15 s</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 12px; color: #5F6168">Paused</span>
      <span style="font-size: 18px; font-weight: 700">0:42</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #ECECEE; border-radius: 16px; padding: 10px 10px 10px 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 600">Burpees done</span>
      <span style="font-size: 13px; color: #5F6168">Fix it if you missed some</span>
    </div>
    <div style="display: flex; align-items: center; gap: 4px">
      <button aria-label="One less" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #F3F3F5; color: #1B1B1F; font-size: 22px; font-weight: 600">−</button>
      <span style="width: 44px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px">28</span>
      <button aria-label="One more" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #F3F3F5; color: #1B1B1F; font-size: 22px; font-weight: 600">+</button>
    </div>
  </div>

  <div style="background: #FFF4E5; border: 1px solid #F9D7A8; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
    <div style="color: #9A4A06; padding-top: 1px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 15px; font-weight: 600">12 left to catch up</span>
      <span style="font-size: 13px; color: #6B4A1F; line-height: 1.4">A “Catch up · 3:00” card will wait on Home. Do it later today — it adds to this session.</span>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5F6168; padding: 0 4px">
    <span>This week</span>
    <span><b style="color: #1B1B1F">68</b> / 150 burpees</span>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <button style="width: 100%; height: 58px; border-radius: 999px; border: none; background: #F28C00; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 17px; font-weight: 700">Save</button>
    <button style="width: 100%; height: 44px; border: none; background: transparent; color: #5F6168; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500">Discard</button>
  </div>
</div>
</body>
</html>
