<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get ready – Burpee Timer mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B45309}a:hover{color:#92400E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; background: #FFFFFF; color: #1B1B1F; font-family: Inter, system-ui, sans-serif; overflow: hidden; padding: 48px 24px 36px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
    <span style="font-size: 13px; font-weight: 600; color: #5F6168; text-transform: uppercase; letter-spacing: 0.1em">Get ready</span>
    <span style="font-size: 20px; font-weight: 700">40 Standard burpees</span>
    <span style="font-size: 14px; color: #5F6168">1 every 15 s · 10:00</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <div style="width: 260px; height: 260px; border-radius: 50%; background: #FFF4E5; display: flex; align-items: center; justify-content: center">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 220px; line-height: 1; color: #1B1B1F">3</span>
    </div>
    <span style="font-size: 15px; color: #5F6168; padding-top: 16px">First beep = first burpee</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%">
    <button style="width: 100%; height: 56px; border-radius: 999px; border: none; background: #F28C00; color: #1B1B1F; font-family: Inter, sans-serif; font-size: 16px; font-weight: 700">Start now</button>
    <button style="height: 44px; padding: 0 20px; border: none; background: transparent; color: #5F6168; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500">Cancel</button>
  </div>
</div>
</body>
</html>
