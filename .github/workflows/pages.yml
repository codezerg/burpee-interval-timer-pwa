# Publishes app/ to GitHub Pages on every push to main.
# App:      https://codezerg.github.io/burpee-interval-timer-pwa/
# Mockups:  https://codezerg.github.io/burpee-interval-timer-pwa/mockups/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test timer engine
        run: npm test

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r app/. _site/
          cp -r docs/mockups _site/mockups
          # The app compares this with what it loaded to know a new version is out.
          echo "{ \"version\": \"${GITHUB_SHA}\", \"date\": \"$(date -u +%Y-%m-%dT%H:%MZ)\" }" > _site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
